name: AwesoMuxCompanion
options:
  bundleIdPrefix: com.interactivebuffoonery
  deploymentTarget:
    iOS: '18.0'
packages:
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    revision: 42bacd1339f323a693ddbca779295f4f77e5a697
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: '0.2'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 7CNK4YPCQX
    CODE_SIGN_STYLE: Automatic
targets:
  AwesoMuxCompanion:
    type: application
    platform: iOS
    sources: [AwesoMuxCompanion, Shared]
    dependencies:
      - target: AwesoMuxCompanionWidgets
    entitlements:
      path: AwesoMuxCompanion/AwesoMuxCompanion.entitlements
      properties:
        com.apple.security.application-groups: [group.com.interactivebuffoonery.awesomux.companion]
    info:
      path: AwesoMuxCompanion/Info.plist
      properties:
        CFBundleDisplayName: awesoMux
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: awesoMux uses the camera to scan the pairing code your Mac shows.
        NSLocalNetworkUsageDescription: awesoMux connects to your Mac on this network to show your agents.
        CFBundleURLTypes:
          - CFBundleURLName: com.interactivebuffoonery.awesomux.companion.pair
            CFBundleURLSchemes: [awesomuxcompanion]
        BGTaskSchedulerPermittedIdentifiers: [com.interactivebuffoonery.awesomux.companion.refresh]
        UIBackgroundModes: [fetch]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AwesoMuxDiagnostics:
    type: application
    platform: iOS
    sources:
      - path: AwesoMuxCompanion
        excludes: [Info.plist, AwesoMuxCompanion.entitlements]
      - Shared
      - path: AwesoMuxDiagnostics
        excludes: [Info.plist, source-manifest.txt]
    preBuildScripts:
      - name: Refresh diagnostic source manifest
        script: python3 "$SRCROOT/script/diagnostics-manifest.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/source-manifest.txt"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
    info:
      path: AwesoMuxDiagnostics/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDisplayName: awesoMux Diagnostics
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Connect to the synthetic snapshot fixture server.
        CFBundleURLTypes:
          - CFBundleURLName: awesomuxdiagnostics.fixture
            CFBundleURLSchemes: [awesomuxdiagnostics]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.diagnostics
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SNAPSHOT_DIAGNOSTICS
  AwesoMuxCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AwesoMuxCompanionWidgets
      - path: Shared
        excludes: [companion-pairing-words.txt]
    entitlements:
      path: AwesoMuxCompanionWidgets/AwesoMuxCompanionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.interactivebuffoonery.awesomux.companion]
    info:
      path: AwesoMuxCompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: awesoMux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion.widgets
  AwesoMuxCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AwesoMuxCompanionTests]
    dependencies:
      - target: AwesoMuxCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion.tests
schemes:
  AwesoMuxCompanion:
    build:
      targets:
        AwesoMuxCompanion: all
    run:
      config: Debug
    test:
      targets:
        - AwesoMuxCompanionTests
  AwesoMuxDiagnostics:
    build:
      targets:
        AwesoMuxDiagnostics: all
    run:
      config: Debug
