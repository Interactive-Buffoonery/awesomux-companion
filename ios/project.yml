name: AwesoMuxCompanion
options:
  bundleIdPrefix: com.interactivebuffoonery
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: '0.2'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 7CNK4YPCQX
    CODE_SIGN_STYLE: Automatic
packages:
  libghostty-spm:
    path: ${GHOSTTY_LOCAL_PACKAGE}
  AwesoMuxCompanionProtocol:
    path: ..
targets:
  AwesoMuxCompanion:
    type: application
    platform: iOS
    sources:
      - AwesoMuxCompanion
      - Shared
      - path: ../spikes/ios-terminal-renderer/IOSRendererSpike/ThirdPartyNotices
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Verify public renderer
        script: python3 "$SRCROOT/script/watch-manifest.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - target: AwesoMuxCompanionWidgets
      - package: AwesoMuxCompanionProtocol
    entitlements:
      path: AwesoMuxCompanion/AwesoMuxCompanion.entitlements
      properties:
        com.apple.security.application-groups: [group.com.interactivebuffoonery.awesomux.companion]
    info:
      path: AwesoMuxCompanion/Info.plist
      properties:
        CFBundleDisplayName: awesoMux
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: awesoMux uses the camera to scan the pairing code your Mac shows.
        NSLocalNetworkUsageDescription: awesoMux connects to your Mac on this network to show your agents.
        CFBundleURLTypes:
          - CFBundleURLName: com.interactivebuffoonery.awesomux.companion.pair
            CFBundleURLSchemes: [awesomuxcompanion]
        BGTaskSchedulerPermittedIdentifiers: [com.interactivebuffoonery.awesomux.companion.refresh]
        UIBackgroundModes: [fetch]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ARCHS: arm64
        DIAGNOSTICS_NATIVE_PACKAGE: ${GHOSTTY_LOCAL_PACKAGE}
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion
        INFOPLIST_KEY_NSFaceIDUsageDescription: awesoMux uses Face ID to unlock your agents and terminals and authenticate Claude permission answers.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AwesoMuxCompanionWidgets:
    type: app-extension
    platform: iOS
    sources: [AwesoMuxCompanionWidgets, Shared]
    entitlements:
      path: AwesoMuxCompanionWidgets/AwesoMuxCompanionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.interactivebuffoonery.awesomux.companion]
    info:
      path: AwesoMuxCompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: awesoMux
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion.widgets
  AwesoMuxCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AwesoMuxCompanionTests
      - path: ../spikes/snapshot-reconnect/input.bin
        buildPhase: resources
      - path: ../spikes/snapshot-reconnect/away.bin
        buildPhase: resources
      - path: ../spikes/snapshot-reconnect/reattach.bin
        buildPhase: resources
    dependencies:
      - target: AwesoMuxCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interactivebuffoonery.awesomux.companion.tests
schemes:
  AwesoMuxCompanion:
    build:
      targets:
        AwesoMuxCompanion: all
    run:
      config: Debug
    test:
      targets:
        - AwesoMuxCompanionTests
